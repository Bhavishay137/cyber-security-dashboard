<!DOCTYPE html>
<html>
<head>
<title>Cyber Arsenal</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #020617, #0f172a, #020617);
    color: white;
    text-align: center;
    overflow: hidden;
}

/* ANIMATED BACKGROUND GRID */
body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.05) 0px,
        rgba(255,255,255,0.05) 1px,
        transparent 1px,
        transparent 40px
    ),
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.05) 0px,
        rgba(255,255,255,0.05) 1px,
        transparent 1px,
        transparent 40px
    );
    animation: moveGrid 10s linear infinite;
}

@keyframes moveGrid {
    0% { transform: translateY(0); }
    100% { transform: translateY(40px); }
}

/* TITLE */
h1 {
    margin-top: 80px;
    font-size: 42px;
    letter-spacing: 3px;
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #0ea5e9; }
    to { text-shadow: 0 0 20px #38bdf8; }
}

/* CONTAINER */
.container {
    margin-top: 100px;
}

/* TOOL CARDS */
.card {
    display: inline-block;
    padding: 30px;
    margin: 25px;
    width: 220px;
    background: rgba(17,24,39,0.9);
    border-radius: 15px;
    cursor: pointer;
    transition: 0.4s;
    position: relative;
}

/* HOVER EFFECT */
.card:hover {
    transform: translateY(-10px) scale(1.05);
    background: #1e293b;
}

/* SKULL DECORATION */
.card::after {
    content: "💀";
    position: absolute;
    top: 10px;
    right: 10px;
    opacity: 0.2;
}

/* LINKS */
a {
    text-decoration: none;
    color: white;
    font-size: 18px;
}
</style>

</head>

<body>

<h1>⚔ CYBER SECURITY ARSENAL ⚔</h1>

<div class="container">

<a href="/password">
<div class="card">🔐 Password Engine</div>
</a>

<a href="/url">
<div class="card">🌐 URL Scanner</div>
</a>

<a href="/message">
<div class="card">📧 Message Analyzer</div>
</a>

</div>

</body>
</html>
