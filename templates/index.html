<!DOCTYPE html>
<html>
<head>
    <title>Cyber Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: white;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: rgba(255,255,255,0.05);
            margin: 15px;
            padding: 20px;
            border-radius: 15px;
            width: 300px;
        }

        input, textarea {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            width: 200px;
            background: cyan;
            border: none;
            border-radius: 8px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>

<h1>🔐 Cyber Security Dashboard</h1>

<form method="POST">

<div class="container">

    <div class="card">
        <h2>Password</h2>
        <input type="text" name="password">
        {% if strength %}
        <p>{{ strength }}</p>
        <p>{{ crack }}</p>
        {% endif %}
    </div>

    <div class="card">
        <h2>URL</h2>
        <input type="text" name="url">
        {% if url_result %}
        <p>{{ url_result }}</p>
        {% endif %}
    </div>

    <div class="card">
        <h2>Message</h2>
        <textarea name="message"></textarea>
        {% if scam_result %}
        <p>{{ scam_result }}</p>
        {% endif %}
    </div>

</div>

<button type="submit">Analyze</button>

</form>

</body>
</html>
